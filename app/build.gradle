plugins {
    id 'com.android.application'
}

// Set the PLAYLIST_URL environment variable (GitHub repository variable) to use another playlist.
def playlistUrl = System.getenv('PLAYLIST_URL') ?: 'https://raw.githubusercontent.com/darknesslord19/Plus-tv/main/playlist.m3u'

android {
    namespace 'com.oliverastudio.sukafilm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oliverastudio.sukafilm'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'PLAYLIST_URL', "\"${playlistUrl}\""
    }

    buildFeatures { buildConfig true }

    lint { checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
