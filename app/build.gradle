plugins {
    id 'com.android.application'
}

// Firebase values come from environment variables (GitHub secrets). Never hard-code them here.
def env = { String name, String fallback -> System.getenv(name) ?: fallback }

android {
    namespace 'com.oliverastudio.sukafilm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oliverastudio.sukafilm'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'FIREBASE_APP_ID', "\"${env('FIREBASE_APP_ID', '')}\""
        buildConfigField 'String', 'FIREBASE_API_KEY', "\"${env('FIREBASE_API_KEY', '')}\""
        buildConfigField 'String', 'FIREBASE_DATABASE_URL', "\"${env('FIREBASE_DATABASE_URL', '')}\""
        buildConfigField 'String', 'FIREBASE_STORAGE_BUCKET', "\"${env('FIREBASE_STORAGE_BUCKET', '')}\""
    }

    buildFeatures { buildConfig true }

    lint { checkReleaseBuilds false }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
