name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      - name: Sign APK with the test key
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          [ -x "$BT/apksigner" ] || sdkmanager "build-tools;34.0.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --key signing/testkey.pk8 --cert signing/testkey.x509.pem --out SukaFilm.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs SukaFilm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SukaFilm-apk
          path: SukaFilm.apk
          if-no-files-found: error
